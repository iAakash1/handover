# Company (TIH) tomato run: QLoRA fine-tune of Qwen2.5-VL-7B-Instruct on CUDA.
#
# Target hardware: one NVIDIA GPU with ~24 GB VRAM (verified on RTX 4500 Ada).
# Separate from configs/train/qwen25vl_tomato.yaml (the MLX research run), which
# this file never touches.
run_name: tih_tomato_qwen_qlora
seed: 20260911

model:
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: bfloat16
  # Longest side after aspect-preserving resize; must be a multiple of 28.
  # 448 bounds the visual-token count and keeps peak VRAM well inside 24 GB.
  image_max_side: 448
  max_seq_length: 1024

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  # Vision tower stays frozen: only language-model projections get adapters.
  train_vision: false
  target_modules: [q_proj, k_proj, v_proj, o_proj]

optim:
  learning_rate: 5.0e-5
  epochs: 3
  batch_size: 1                    # micro-batch
  gradient_accumulation_steps: 8   # effective batch size = 8
  weight_decay: 0.0
  warmup_ratio: 0.03
  scheduler: cosine
  grad_clip: 1.0
  grad_checkpoint: true
  optimizer: paged_adamw_8bit

data:
  profile: configs/company_tomato_classes.yaml
  # The dataset contains both leaf and fruit classes, so the prompt says
  # "plant image" rather than "leaf".
  instruction: "Classify this tomato plant image into exactly one of these categories: Aphid, Early Blight Fruit, Fruit Borer, Healthy Fruit, Healthy Leaf, Late Blight, Leaf Curl, Leaf Miner, Mealy Bugs, Target Leaf Spot, White Fly. Return only the category name."
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  split_seed: 20260911
  # Drop byte-identical duplicates so no image can appear in two splits.
  deduplicate: true

evaluation:
  max_new_tokens: 24
  limit: null      # null = evaluate the whole split

output:
  dataset_dir: artifacts/company/tih_tomato_qwen_qlora/dataset
  checkpoint_dir: checkpoints/tih_tomato_qwen_qlora
  log_dir: logs/tih_tomato_qwen_qlora
  report_dir: reports/tih_tomato_qwen_qlora
