# Accuracy-focused company/TIH tomato experiment. This changes only training
# hyperparameters from qwen25vl_tih_tomato_strong.yaml; data and model family
# remain identical.

run_name: tih_tomato_moreaccurate
seed: 20260911

model:
  model_id: Qwen/Qwen2.5-VL-7B-Instruct
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: bfloat16
  image_max_side: 532
  max_seq_length: 1024

lora:
  rank: 64
  alpha: 128
  dropout: 0.05
  train_vision: false
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj

optim:
  learning_rate: 4.0e-5
  epochs: 3
  batch_size: 1
  gradient_accumulation_steps: 8
  weight_decay: 0.0
  warmup_ratio: 0.03
  scheduler: cosine
  grad_clip: 1.0
  grad_checkpoint: true
  optimizer: paged_adamw_8bit

data:
  profile: configs/company_tomato_classes.yaml
  instruction: "Classify this tomato plant image into exactly one of these categories: Aphid, Early Blight Fruit, Fruit Borer, Healthy Fruit, Healthy Leaf, Late Blight, Leaf Curl, Leaf Miner, Mealy Bugs, Target Leaf Spot, White Fly. Return only the category name."
  train_ratio: 0.80
  val_ratio: 0.10
  test_ratio: 0.10
  split_seed: 20260911
  deduplicate: true

evaluation:
  max_new_tokens: 24
  limit: null

output:
  dataset_dir: artifacts/company/tih_tomato_moreaccurate/dataset
  checkpoint_dir: checkpoints/tih_tomato_moreaccurate
  log_dir: logs/tih_tomato_moreaccurate
  report_dir: reports/tih_tomato_moreaccurate
